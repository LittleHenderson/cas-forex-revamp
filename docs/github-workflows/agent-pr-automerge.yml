name: Continuous AI-Agent PR Auto-Merger

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ["CAS Forex Revamp CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

concurrency:
  group: cas-forex-revamp-agent-pr-automerge
  cancel-in-progress: false

jobs:
  merge-ready-agent-prs:
    name: Periodically Verify & Merge Passing AI-Agent PRs
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Evaluate completion gate and merge passing PRs
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          repo = os.environ["REPO"]
          OWNER_USER_ID = 98265490
          GITHUB_ACTIONS_APP_ID = 15368

          DEFAULT_AUTHOR_IDS = {OWNER_USER_ID}
          DEFAULT_APPROVER_IDS = {OWNER_USER_ID}
          DEFAULT_BOT_APP_IDS = set()
          DEFAULT_CHECK_APP_IDS = {GITHUB_ACTIONS_APP_ID}
          DEFAULT_WORKFLOW_PATHS = {".github/workflows/ci.yml"}
          DEFAULT_WORKFLOW_EVENTS = {"pull_request", "push"}
          DEFAULT_REQUIRED_JOBS = {
              "Secret & Strict-CSP Gate",
              "Node UI Suite",
              "Python Unit & Contract Suites",
          }
          INTENT_LABELS = {"agent-pr", "automerge-ready", "auto-merge", "agent-ready"}
          HOLD_LABELS = {"do-not-merge", "hold"}
          SHA40_RE = re.compile(r"^[0-9a-fA-F]{40}$")
          APPROVE_CMD_RE = re.compile(r"^/approve\s+([0-9a-fA-F]{40})(?:\s+pr=#?(\d+))?$", re.IGNORECASE)
          REVOKE_CMD_RE = re.compile(r"^/(?:hold|reject|cancel)(?:\s|$)", re.IGNORECASE)
          RUN_URL_RE = re.compile(r"/actions/runs/(\d+)")
          PR_URL_RE = re.compile(r"(?:/repos/([^/]+/[^/]+))?/(?:pulls|issues)/(\d+)$")

          def is_pos_int(v):
              return isinstance(v, int) and not isinstance(v, bool) and v > 0

          def gh_json(args):
              res = subprocess.run(["gh"] + args, capture_output=True, text=True, check=True)
              return json.loads(res.stdout) if res.stdout.strip() else {}

          def gh_paginate(endpoint, item_key=None, per_page=100, max_pages=100):
              sep = "&" if "?" in endpoint else "?"
              out = []
              for page in range(1, max_pages + 1):
                  doc = gh_json(["api", f"{endpoint}{sep}per_page={per_page}&page={page}"])
                  batch = doc if item_key is None else doc.get(item_key, [])
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Unexpected non-list payload from {endpoint}")
                  out.extend(batch)
                  if len(batch) < per_page:
                      return out
              raise RuntimeError(f"Pagination exceeded {max_pages} pages for {endpoint}")

          gate_path = pathlib.Path("docs/REVAMP_COMPLETION_GATE.json")
          if not gate_path.is_file():
              sys.exit("Missing docs/REVAMP_COMPLETION_GATE.json on main — failing closed.")
          gate = json.loads(gate_path.read_text(encoding="utf-8"))
          if gate.get("revamp_completed") is True:
              print("CAS Forex Revamp completion gate is TRUE — halting continuous auto-merge.")
              sys.exit(0)

          raw_pol = gate.get("automerge_policy") or {}
          allowed_author_ids = set(raw_pol.get("allowed_author_user_ids", DEFAULT_AUTHOR_IDS))
          allowed_approver_ids = set(raw_pol.get("allowed_approver_user_ids", DEFAULT_APPROVER_IDS))
          allowed_bot_app_ids = set(raw_pol.get("allowed_bot_app_ids", DEFAULT_BOT_APP_IDS))
          trusted_check_app_ids = set(raw_pol.get("trusted_check_app_ids", DEFAULT_CHECK_APP_IDS))
          trusted_wf_paths = set(raw_pol.get("trusted_workflow_paths", DEFAULT_WORKFLOW_PATHS))
          trusted_wf_ids_policy = set(raw_pol.get("trusted_workflow_ids", []))
          trusted_events = set(raw_pol.get("trusted_workflow_events", DEFAULT_WORKFLOW_EVENTS))
          required_jobs = set(raw_pol.get("required_ci_jobs", DEFAULT_REQUIRED_JOBS))

          if not allowed_author_ids or not allowed_approver_ids or not trusted_check_app_ids or not trusted_wf_paths or not required_jobs:
              sys.exit("Invalid empty automerge_policy — failing closed.")

          workflows = gh_paginate(f"repos/{repo}/actions/workflows", item_key="workflows")
          trusted_wf_ids_by_path = {}
          for wf in workflows:
              if is_pos_int(wf.get("id")) and wf.get("path") in trusted_wf_paths and str(wf.get("state", "active")).lower() == "active":
                  trusted_wf_ids_by_path.setdefault(wf["path"], set()).add(wf["id"])

          def authorize_pr(pr):
              num = pr.get("number")
              state = str(pr.get("state") or "").strip().upper()
              is_draft = bool(pr.get("draft", True))
              base_obj = pr.get("base") or {}
              head_obj = pr.get("head") or {}
              base_ref = str(base_obj.get("ref") or "").strip()
              sha = str(head_obj.get("sha") or "").strip()
              head_repo = head_obj.get("repo") or {}
              base_repo = base_obj.get("repo") or {}
              head_repo_name = str(head_repo.get("full_name") or "").strip()
              base_repo_name = str(base_repo.get("full_name") or "").strip()

              if state != "OPEN" or is_draft or base_ref != "main" or not SHA40_RE.fullmatch(sha):
                  return False, "SKIP_STATE_DRAFT_OR_BASE"
              if head_repo.get("fork") is True or not head_repo_name or head_repo_name.lower() != repo.lower():
                  return False, f"SKIP_UNTRUSTED_HEAD_REPO:{head_repo_name}"
              if base_repo_name and base_repo_name.lower() != repo.lower():
                  return False, f"SKIP_UNTRUSTED_BASE_REPO:{base_repo_name}"
              if is_pos_int(head_repo.get("id")) and is_pos_int(base_repo.get("id")) and head_repo["id"] != base_repo["id"]:
                  return False, "SKIP_HEAD_BASE_REPO_ID_MISMATCH"

              user = pr.get("user") or {}
              uid = user.get("id")
              login = str(user.get("login") or "")
              is_bot = user.get("type") == "Bot" or login.endswith("[bot]")
              app_id = user.get("app_id")
              if is_bot:
                  if not ((is_pos_int(app_id) and app_id in allowed_bot_app_ids) or (is_pos_int(uid) and uid in allowed_author_ids and (app_id is None or app_id in allowed_bot_app_ids))):
                      return False, f"SKIP_UNTRUSTED_BOT_AUTHOR:{uid}:{app_id}"
              elif not (is_pos_int(uid) and uid in allowed_author_ids):
                  return False, f"SKIP_UNTRUSTED_AUTHOR:{uid}"

              labels = {str(lb.get("name") or "").strip().lower() for lb in (pr.get("labels") or []) if isinstance(lb, dict)}
              if labels & HOLD_LABELS:
                  return False, "SKIP_HOLD_LABEL"
              if not (labels & INTENT_LABELS):
                  return False, "SKIP_UNLABELED"
              return True, "OK"

          def matches_pr(rec, num):
              for k in ("pull_request_url", "issue_url"):
                  v = rec.get(k)
                  if v is not None:
                      m = PR_URL_RE.search(str(v))
                      if not m or int(m.group(2)) != num or (m.group(1) and m.group(1).lower() != repo.lower()):
                          return False
              return True

          def verify_approval(num, sha):
              reviews = gh_paginate(f"repos/{repo}/pulls/{num}/reviews")
              latest = {}
              for idx, rev in enumerate(sorted(reviews, key=lambda r: (str(r.get("submitted_at") or ""), int(r.get("id") or 0)))):
                  if not matches_pr(rev, num):
                      continue
                  uid = (rev.get("user") or {}).get("id")
                  if not is_pos_int(uid) or uid not in allowed_approver_ids:
                      continue
                  st = str(rev.get("state") or "").strip().upper()
                  csha = str(rev.get("commit_id") or "").strip().lower()
                  if st in {"APPROVED", "CHANGES_REQUESTED", "DISMISSED"}:
                      latest[uid] = (st, csha)
              for uid, (st, _) in latest.items():
                  if st == "CHANGES_REQUESTED":
                      return False
              for uid, (st, csha) in latest.items():
                  if st == "APPROVED" and csha == sha.lower():
                      return True
              timeline = gh_paginate(f"repos/{repo}/issues/{num}/timeline")
              comment_ok = {}
              for idx, ev in enumerate(sorted(timeline, key=lambda e: (str(e.get("created_at") or e.get("submitted_at") or ""), int(e.get("id") or 0)))):
                  if not matches_pr(ev, num):
                      continue
                  uid = ((ev.get("user") or ev.get("actor") or {})).get("id")
                  if not is_pos_int(uid) or uid not in allowed_approver_ids:
                      continue
                  et = str(ev.get("event") or "").strip().lower()
                  if et == "reviewed":
                      st = str(ev.get("state") or "").strip().upper()
                      csha = str(ev.get("commit_id") or "").strip().lower()
                      if st in {"APPROVED", "CHANGES_REQUESTED", "DISMISSED"}:
                          latest[uid] = (st, csha)
                  elif et == "commented":
                      for raw_line in str(ev.get("body") or "").splitlines():
                          line = raw_line.strip()
                          m = APPROVE_CMD_RE.fullmatch(line)
                          if m and m.group(1).lower() == sha.lower() and (m.group(2) is None or int(m.group(2)) == num):
                              comment_ok[uid] = True
                          elif REVOKE_CMD_RE.match(line):
                              comment_ok.pop(uid, None)
              if any(st == "CHANGES_REQUESTED" for st, _ in latest.values()):
                  return False
              return any(st == "APPROVED" and csha == sha.lower() for st, csha in latest.values()) or bool(comment_ok)

          def verify_checks(sha):
              check_runs = gh_paginate(f"repos/{repo}/commits/{sha}/check-runs", item_key="check_runs")
              if not check_runs:
                  return False, "WAITING_CI_CHECKS_EMPTY"
              wf_runs = gh_paginate(f"repos/{repo}/actions/runs?head_sha={sha}", item_key="workflow_runs")
              suites = gh_paginate(f"repos/{repo}/commits/{sha}/check-suites", item_key="check_suites")
              suites_by_id = {cs["id"]: cs for cs in suites if is_pos_int(cs.get("id"))}
              runs_by_id = {wr["id"]: wr for wr in wf_runs if is_pos_int(wr.get("id"))}
              runs_by_suite = {}
              for wr in wf_runs:
                  if is_pos_int(wr.get("id")) and is_pos_int(wr.get("check_suite_id")):
                      runs_by_suite.setdefault(wr["check_suite_id"], []).append(wr)

              latest_by_name = {}
              for cr in check_runs:
                  name = str(cr.get("name") or "")
                  if name == "Periodically Verify & Merge Passing AI-Agent PRs":
                      continue
                  if not is_pos_int(cr.get("id")) or not name.strip():
                      continue
                  app_id = (cr.get("app") or {}).get("id")
                  if not is_pos_int(app_id) or app_id not in trusted_check_app_ids:
                      continue
                  if str(cr.get("head_sha") or "").strip().lower() != sha.lower():
                      continue
                  cs = cr.get("check_suite") or {}
                  sid = cs.get("id")
                  if not is_pos_int(sid):
                      continue
                  fs = suites_by_id.get(sid)
                  if fs is None:
                      continue
                  fs_app = (fs.get("app") or {}).get("id")
                  if str(fs.get("head_sha") or "").strip().lower() != sha.lower() or not is_pos_int(fs_app) or fs_app not in trusted_check_app_ids:
                      continue

                  wr = None
                  for uk in ("details_url", "html_url"):
                      m = RUN_URL_RE.search(str(cr.get(uk) or ""))
                      if m:
                          cand = runs_by_id.get(int(m.group(1)))
                          wr = cand if cand and cand.get("check_suite_id") == sid else None
                          break
                  else:
                      cands = runs_by_suite.get(sid) or []
                      wr = cands[0] if len(cands) == 1 else None
                  if wr is None:
                      continue
                  wr_repo = ((wr.get("repository") or {}).get("full_name") or "").strip()
                  if wr_repo.lower() != repo.lower():
                      continue
                  if isinstance(wr.get("head_repository"), dict):
                      if str(wr["head_repository"].get("full_name") or "").strip().lower() != repo.lower():
                          continue
                  if str(wr.get("head_sha") or "").strip().lower() != sha.lower():
                      continue
                  if str(wr.get("event") or "").strip() not in trusted_events:
                      continue
                  wr_path = str(wr.get("path") or "").strip()
                  wr_wf_id = wr.get("workflow_id")
                  if wr_path not in trusted_wf_paths or not is_pos_int(wr_wf_id):
                      continue
                  if trusted_wf_ids_policy and wr_wf_id not in trusted_wf_ids_policy:
                      continue
                  exp_ids = trusted_wf_ids_by_path.get(wr_path)
                  if exp_ids and wr_wf_id not in exp_ids:
                      continue

                  prev = latest_by_name.get(name)
                  if prev is None or int(cr["id"]) > int(prev["id"]):
                      latest_by_name[name] = cr

              if not latest_by_name:
                  return False, "WAITING_CI_CHECKS_EMPTY"
              missing = sorted(required_jobs - set(latest_by_name.keys()))
              if missing:
                  return False, f"WAITING_REQUIRED_CI_JOBS:{missing}"
              bad = [f"{n}:{c.get('status')}/{c.get('conclusion')}" for n, c in sorted(latest_by_name.items()) if c.get("status") != "completed" or c.get("conclusion") != "success"]
              if bad:
                  return False, f"WAITING_CI_CHECKS:{bad}"
              return True, "OK"

          prs = gh_paginate(f"repos/{repo}/pulls?state=open&base=main")
          print(f"Found {len(prs)} open PR(s) targeting main.")

          for pr in sorted(prs, key=lambda x: x["number"]):
              num = pr["number"]
              title = pr.get("title", "")
              ok_auth, auth_msg = authorize_pr(pr)
              if not ok_auth:
                  print(f"PR #{num} ({title}): {auth_msg} — skipping.")
                  continue

              sha = pr["head"]["sha"]
              if not verify_approval(num, sha):
                  print(f"PR #{num} ({title}): missing SHA-bound owner approval on {sha[:12]} — skipping.")
                  continue

              detail_pr = gh_json(["api", f"repos/{repo}/pulls/{num}"])
              ok_detail, detail_msg = authorize_pr(detail_pr)
              if not ok_detail or detail_pr["head"]["sha"].lower() != sha.lower():
                  print(f"PR #{num} ({title}): changed before detail check ({detail_msg}) — skipping.")
                  continue
              if str(detail_pr.get("mergeable_state") or "").strip().lower() == "behind":
                  print(f"PR #{num} ({title}): branch is BEHIND main — updating branch for next CI cycle.")
                  subprocess.run(["gh", "api", f"repos/{repo}/pulls/{num}/update-branch", "-X", "PUT"], check=False)
                  continue

              checks_ok, checks_msg = verify_checks(sha)
              if not checks_ok:
                  print(f"PR #{num} ({title}): {checks_msg} on {sha[:12]} — failing closed.")
                  continue

              live_pr = gh_json(["api", f"repos/{repo}/pulls/{num}"])
              ok_live, live_msg = authorize_pr(live_pr)
              if not ok_live or live_pr["head"]["sha"].lower() != sha.lower():
                  print(f"PR #{num} ({title}): PR metadata changed before merge ({live_msg}) — aborting.")
                  continue
              if not verify_approval(num, sha):
                  print(f"PR #{num} ({title}): SHA-bound approval missing at pre-merge revalidation — aborting.")
                  continue
              rechecks_ok, rechecks_msg = verify_checks(sha)
              if not rechecks_ok:
                  print(f"PR #{num} ({title}): pre-merge recheck failed ({rechecks_msg}) — aborting.")
                  continue

              print(f"PR #{num} ({title}): all immutable auth + provenance-verified checks PASSED on {sha[:12]} — merging now!")
              m_res = subprocess.run(
                  ["gh", "pr", "merge", str(num), "--repo", repo, "--squash", "--delete-branch", "--match-head-commit", sha],
                  capture_output=True, text=True,
              )
              print(m_res.stdout, m_res.stderr)
              if m_res.returncode == 0:
                  print(f"PR #{num} MERGED successfully.")
                  break
